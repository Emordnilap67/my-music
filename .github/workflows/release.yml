# Builds MY MUSIC on GitHub. Pushing a tag like v1.0 publishes the APK on
# the Releases page; "Run workflow" (Actions tab) builds one to try.
name: Build MY MUSIC

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the APK
        id: build
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: bash tools/build-ci.sh

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: MyMusic-apk
          path: out/*.apk

      - name: Publish it on the Releases page
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
          else
            gh release create "$TAG" out/*.apk --title "MY MUSIC ${TAG#v}" --notes-file tools/release-notes.md
          fi
